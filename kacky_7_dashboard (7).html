<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kacky 7 - Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root { --bg: #0f0f13; --panel: #1b1b22; --text: #eee; --accent: #ff0055; --border: #333; --success: #00d26a; --blue: #00d2ff; --danger: #ff4444; --warning: #ffaa00; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* LAYOUT */
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; overflow-y: auto; flex-shrink: 0; z-index: 2; }
        .main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; overflow-y: auto; position: relative; }

        /* HEADER */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .app-title { margin: 0; color: var(--accent); font-size: 1.3rem; letter-spacing: 1px; }
        .countdown-box { background: #2a2a35; padding: 5px 15px; border-radius: 20px; border: 1px solid #444; font-variant-numeric: tabular-nums; font-size: 0.9rem; color: #aaa; }
        .countdown-time { color: #fff; font-weight: bold; margin-left: 5px; }

        /* BUTTONS */
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .btn { padding: 10px; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; text-align: center; color: #000; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-fetch { background: var(--warning); }
        .btn-add { background: var(--blue); }
        
        /* PLAYER LIST */
        .player-list { display: flex; flex-direction: column; gap: 10px; }
        .player-card { background: #25252e; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; transition: 0.3s; }
        .card-header { padding: 10px; display: flex; justify-content: space-between; align-items: flex-start; background: rgba(255,255,255,0.03); }
        .p-info { display: flex; flex-direction: column; gap: 4px; }
        .p-name { font-weight: bold; font-size: 0.95rem; color: #fff; }
        .p-meta { font-size: 0.7rem; color: #666; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        
        /* Average Rank Badge */
        .p-avg { color: #000; background: var(--blue); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; display:none; }
        .p-avg.visible { display: inline-block; }
        
        .p-id { background: #333; color: #888; padding: 1px 4px; border-radius: 3px; }
        .p-actions { display: flex; align-items: center; gap: 8px; }
        .p-stat { font-weight: bold; font-size: 0.9rem; color: var(--success); }
        .btn-icon { background: transparent; border: none; color: #555; cursor: pointer; font-size: 1rem; padding: 2px; transition: 0.2s; }
        .btn-icon:hover { color: #fff; }
        .btn-del:hover { color: var(--danger); }

        /* CONTROLS */
        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; background: var(--panel); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); align-items: center; }
        .cb-item { display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: 0.4; transition: 0.2s; font-size: 0.9rem; user-select: none; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }
        .cb-item.active { opacity: 1; font-weight: bold; background: rgba(255,255,255,0.15); box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .cb-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* CHART & DETAILS */
        .chart-box { background: var(--panel); border-radius: 8px; padding: 15px; height: 500px; position: relative; border: 1px solid var(--border); cursor: crosshair; }
        .details-box { background: var(--panel); border-radius: 8px; padding: 20px; flex: 1; min-height: 200px; border: 1px solid var(--border); }
        .details-title { border-bottom: 1px solid var(--border); margin-bottom: 15px; padding-bottom: 10px; font-size: 1.1rem; color: #fff; }
        
        .map-badge { background: #2b2b36; color: #ccc; padding: 6px 12px; border-radius: 4px; margin: 4px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid #444; font-size: 0.85rem; transition: 0.2s; }
        .map-badge:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-2px); }
        .ts { font-family: monospace; font-size: 0.85em; opacity: 0.6; background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 3px; color: var(--blue); }

        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; justify-content: center; align-items: center; color: white; font-size: 1.5rem; display: none; backdrop-filter: blur(3px); }
        .spinner { width: 40px; height: 40px; border: 4px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loading-overlay" id="loader"><div class="spinner"></div> Fetching Live Data...</div>

<div class="sidebar">
    <div class="header-row">
        <h2 class="app-title">Kacky 7 Tracker</h2>
    </div>
    
    <div class="btn-group">
        <button id="btnFetch" class="btn btn-fetch" onclick="fetchLiveStats(true)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            Fetch Live Data
        </button>
        <button class="btn btn-add" onclick="addCustomPlayer()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add Player
        </button>
    </div>

    <div id="playerList" class="player-list"></div>
</div>

<div class="main">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="controls-row" id="checkboxContainer" style="flex:1; margin-right:15px;"></div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span style="font-size: 0.85rem; color: #888; font-style: italic;">Click on a players name to toggle visibility</span>
            <div class="countdown-box">
                Event Ends: <span id="timer" class="countdown-time">Loading...</span>
            </div>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="kackyChart"></canvas>
    </div>

    <div class="details-box">
        <div class="details-title" id="detailsHeader">Click graph to view daily details</div>
        <div id="detailsList"></div>
    </div>
</div>

<script>
    // --- KACKY 7 CONFIG ---
    const KACKY_END_DATE = new Date("2026-11-30T19:00:00Z"); // Approx End date for KR7
    const EVENT_ID = "26"; // KR7 Event ID from API

    const DEFAULT_PLAYERS = [];

    // --- STATE ---
    let players = [];
    let playerData = {}; 
    let chartInstance = null;
    let selectedDay = -1;
    let lastFetchTime = 0;

    function init() {
        startTimer();
        initChart();

        const savedConfig = localStorage.getItem('kacky7_pro_config');
        players = savedConfig ? JSON.parse(savedConfig) : JSON.parse(JSON.stringify(DEFAULT_PLAYERS));

        const savedData = localStorage.getItem('kacky7_pro_data');
        if (savedData) {
            const parsedData = JSON.parse(savedData);
            Object.keys(parsedData).forEach(pid => {
                if (parsedData[pid].finishes) {
                    parsedData[pid].finishes.forEach(f => f.dateObj = new Date(f.isoDate));
                }
            });
            playerData = parsedData;
        }

        const savedTime = localStorage.getItem('kacky7_last_fetch');
        if (savedTime) lastFetchTime = parseInt(savedTime);

        const savedDay = localStorage.getItem('kacky7_selected_day');
        if(savedDay) selectedDay = parseInt(savedDay);

        sortPlayers();
        renderAll();
        if(selectedDay !== -1) showDetails(selectedDay);

        // Auto-fetch if in Generator Mode AND data is older than 5 mins
        if(!PRELOADED_STATE) {
            const now = Date.now();
            const timeSinceLastFetch = now - lastFetchTime;
            const cooldown = 5 * 60 * 1000; // 5 minutes

            if (timeSinceLastFetch > cooldown) {
                setTimeout(() => fetchLiveStats(false), 500);
            } else {
                // Instantly use cached data
                const btn = document.getElementById('btnFetch');
                const secondsLeft = Math.ceil((cooldown - timeSinceLastFetch) / 1000);
                btn.innerHTML = `Cached (${secondsLeft}s)`;
                btn.style.opacity = 0.7;
                
                // Reset button when cooldown is over
                setTimeout(() => {
                    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Fetch Live Data`;
                    btn.style.opacity = 1;
                }, cooldown - timeSinceLastFetch);
            }
        }
    }

    // --- LOGIC ---
    function sortPlayers() {
        players.sort((a, b) => {
            const dataA = playerData[a.id] || { finishes: [], avgRank: 99999, totalCount: 0 };
            const dataB = playerData[b.id] || { finishes: [], avgRank: 99999, totalCount: 0 };
            
            const countA = dataA.totalCount ? Math.max(dataA.totalCount, dataA.finishes.length) : dataA.finishes.length;
            const countB = dataB.totalCount ? Math.max(dataB.totalCount, dataB.finishes.length) : dataB.finishes.length;
            
            // 1. Finishes DESC
            if (countA !== countB) return countB - countA;
            
            // 2. Avg Rank ASC
            const avgA = dataA.avgRank ? parseFloat(dataA.avgRank) : 99999;
            const avgB = dataB.avgRank ? parseFloat(dataB.avgRank) : 99999;
            return avgA - avgB;
        });
    }

    function renderAll() {
        const list = document.getElementById('playerList');
        const toggles = document.getElementById('checkboxContainer');
        const savedToggles = JSON.parse(localStorage.getItem('kacky7_view_toggles') || '[]');

        list.innerHTML = '';
        toggles.innerHTML = '';

        players.forEach(p => {
            const data = playerData[p.id] || { finishes: [], avgRank: null, totalCount: 0 };
            const count = data.totalCount ? Math.max(data.totalCount, data.finishes.length) : data.finishes.length;
            const avgDisplay = data.avgRank ? `Avg: ${data.avgRank}` : '';
            const kidDisplay = p.kid ? `ID: ${p.kid}` : '';

            const card = document.createElement('div');
            card.className = `player-card ${count > 0 ? 'has-data' : ''}`;
            card.innerHTML = `
                <div class="card-header">
                    <div class="p-info">
                        <span class="p-name" style="color:${p.color}">${p.name}</span>
                        <div class="p-meta">
                            <span class="p-avg ${avgDisplay ? 'visible' : ''}">${avgDisplay}</span>
                            <span class="p-id">${kidDisplay}</span>
                        </div>
                    </div>
                    <div class="p-actions">
                        <span class="p-stat">${count} Fins</span>
                        <button class="btn-icon btn-del" onclick="deletePlayer(${p.id})" title="Remove">&times;</button>
                    </div>
                </div>
            `;
            list.appendChild(card);

            const label = document.createElement('label');
            label.className = 'cb-item';
            label.id = `lbl-${p.id}`;
            const isChecked = savedToggles.includes(p.id) || (savedToggles.length === 0 && p.id < 5);
            
            label.innerHTML = `<div class="cb-dot" style="background:${p.color}"></div><input type="checkbox" id="cb-${p.id}" style="display:none" ${isChecked ? 'checked' : ''}>${p.name}`;
            label.onclick = (e) => { setTimeout(() => { updateVisuals(); saveState(); }, 10); };
            if(isChecked) label.classList.add('active');
            toggles.appendChild(label);
        });
        updateChart();
    }

    function updateVisuals() {
        players.forEach(p => {
            const cb = document.getElementById(`cb-${p.id}`);
            const lbl = document.getElementById(`lbl-${p.id}`);
            if(cb && lbl) {
                if(cb.checked) lbl.classList.add('active'); else lbl.classList.remove('active');
            }
        });
        updateChart();
        if(selectedDay !== -1) showDetails(selectedDay);
    }

    // --- FETCH & PARSE ---
    async function fetchLiveStats(isManualTrigger = false) {
        const now = Date.now();
        const cooldown = 5 * 60 * 1000;
        
        // Prevent manual spamming if data is fresh (unless forced by clearing storage)
        if (isManualTrigger && (now - lastFetchTime < cooldown)) {
            const secondsLeft = Math.ceil((cooldown - (now - lastFetchTime)) / 1000);
            alert(`Data is fresh! Please wait ${secondsLeft} seconds before fetching again to prevent rate-limiting.`);
            return;
        }

        const loader = document.getElementById('loader');
        if(isManualTrigger) loader.style.display = 'flex';
        const btn = document.getElementById('btnFetch');
        const prevText = btn.innerHTML;
        btn.innerHTML = "Fetching API...";

        let success = 0;

        // Ultimate Fast Fetch: Races the two fastest proxies simultaneously
        const fetchApi = async (url) => {
            const enc = encodeURIComponent(url);
            
            // Define our two fastest routes
            const p1 = fetch(`https://corsproxy.io/?url=${enc}`).then(r => r.ok ? r.json() : Promise.reject());
            const p2 = fetch(`https://api.allorigins.win/raw?url=${enc}`).then(r => r.ok ? r.json() : Promise.reject());
            
            try {
                // Promise.any resolves the INSTANT one of the proxies returns valid data
                return await Promise.any([p1, p2]);
            } catch (e) {
                // If both fail, fallback to the deep cached wrapper
                try {
                    const r3 = await fetch(`https://api.allorigins.win/get?url=${enc}&disableCache=true`);
                    if(r3.ok) {
                        const data = await r3.json();
                        if (data.contents) return JSON.parse(data.contents);
                    }
                } catch(e2) {}
            }
            return null;
        };

        for (let i = 0; i < players.length; i++) {
            const p = players[i];
            if (!p.kid) continue;
            
            btn.innerHTML = `Fetching API (${i + 1}/${players.length})...`;

            const statsUrl = `https://api.kacky.gg/v1/players/${p.kid}/stats`;
            const clipsUrl = `https://api.kacky.gg/v1/players/${p.kid}/finish-clips`;

            const [statsJson, clipsJson] = await Promise.all([
                fetchApi(statsUrl),
                fetchApi(clipsUrl)
            ]);

            if (statsJson || clipsJson) {
                processJsonData(p.id, statsJson, clipsJson);
                success++;
            }
            
            // Add a small delay between players to prevent rate limiting and timeouts
            await new Promise(r => setTimeout(r, 300));
        }

        loader.style.display = 'none';
        
        // Reset button text
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Fetch Live Data`;
        btn.style.opacity = 1;

        if (success > 0) { 
            lastFetchTime = Date.now();
            localStorage.setItem('kacky7_last_fetch', lastFetchTime);
            sortPlayers(); 
            renderAll(); 
            saveState(); 
        } 
        else if(isManualTrigger) alert("Fetch failed. Kacky.gg API might be blocking the proxies, or your adblocker is blocking them.");
    }

    function processJsonData(id, statsJson, clipsJson) {
        let finishes = playerData[id]?.finishes || [];
        let avgRank = playerData[id]?.avgRank || null;
        let totalCount = playerData[id]?.totalCount || 0;

        if (statsJson && statsJson.currentEvent && statsJson.currentEvent.eventId === parseInt(EVENT_ID)) {
            // KR7 Average is now in milliseconds (e.g. 33633.6875 ms = 33.6s)
            if (statsJson.currentEvent.average) {
                avgRank = (parseFloat(statsJson.currentEvent.average) / 1000).toFixed(1) + "s";
            }
            if (statsJson.currentEvent.finishes !== undefined) totalCount = statsJson.currentEvent.finishes;
        }

        if (clipsJson && clipsJson.clips) {
            const newFinishes = [];
            clipsJson.clips.forEach(c => {
                if (c.eventId === parseInt(EVENT_ID)) {
                    // This extracts the exact timestamp the map was finished for the graph
                    const d = new Date(c.finishedAt);
                    newFinishes.push({ 
                        map: c.mapNumber, 
                        dateObj: d, 
                        isoDate: c.finishedAt, 
                        timeStr: d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        clipUrl: c.url 
                    });
                }
            });
            if(newFinishes.length > 0) finishes = newFinishes;
        }

        const unique = [];
        const seen = new Set();
        finishes.forEach(f => { if(!seen.has(f.map)) { seen.add(f.map); unique.push(f); } });
        unique.sort((a,b) => a.dateObj - b.dateObj);
        playerData[id] = { finishes: unique, avgRank: avgRank, totalCount: totalCount };
    }

    // --- CHART ---
    function initChart() {
        const ctx = document.getElementById('kackyChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: { datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { 
                    mode: 'index', 
                    intersect: false, 
                    axis: 'x' 
                },
                scales: {
                    x: { 
                        type: 'time', 
                        time: { unit: 'day', displayFormats: { day: 'MMM d' } }, 
                        min: '2026-10-30T18:00:00Z', 
                        max: '2026-12-01T00:00:00Z', 
                        grid: { color: '#333' } 
                    },
                    y: { beginAtZero: true, max: 75, grid: { color: '#333' }, title: { display: true, text: 'Total Maps' } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        enabled: false, 
                        external: customTooltip // Time Machine Tooltip
                    }
                },
                onClick: (e, elements) => {
                    const canvasPosition = Chart.helpers.getRelativePosition(e, chartInstance);
                    const dataX = chartInstance.scales.x.getValueForPixel(canvasPosition.x);
                    if (dataX) showDetails(new Date(dataX)); // Pass full date object
                }
            }
        });
    }

    // TIME MACHINE TOOLTIP
    function customTooltip(context) {
        const tooltipModel = context.tooltip;
        let tooltipEl = document.getElementById('chartjs-tooltip');
        if (!tooltipEl) {
            tooltipEl = document.createElement('div');
            tooltipEl.id = 'chartjs-tooltip';
            tooltipEl.style.cssText = 'background:rgba(0,0,0,0.9); border:1px solid #555; border-radius:5px; color:#fff; pointer-events:none; position:absolute; transform:translate(-50%,0); transition:opacity .2s; z-index:100; padding:10px; font-size:12px; min-width:150px;';
            document.body.appendChild(tooltipEl);
        }
        if (tooltipModel.opacity === 0) { tooltipEl.style.opacity = 0; return; }

        if (tooltipModel.body) {
            const hoverTime = tooltipModel.dataPoints[0].parsed.x;
            const dateStr = new Date(hoverTime).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
            
            let lines = [];
            players.forEach(p => {
                const cb = document.getElementById(`cb-${p.id}`);
                if (cb && cb.checked && playerData[p.id]) {
                    const fins = playerData[p.id].finishes;
                    let count = 0;
                    for(let i=0; i<fins.length; i++) {
                        if(fins[i].dateObj.getTime() <= hoverTime) count++;
                        else break;
                    }
                    lines.push({ name: p.name, count: count, color: p.color });
                }
            });
            // Sort descending by score
            lines.sort((a, b) => b.count - a.count);
            
            let html = `<div style="font-weight:bold; border-bottom:1px solid #555; margin-bottom:5px; padding-bottom:3px;">${dateStr}</div>`;
            lines.forEach(l => {
                html += `<div style="display:flex; justify-content:space-between; gap:15px; align-items:center;">
                    <span style="display:flex; align-items:center; gap:5px;"><span style="background:${l.color}; width:8px; height:8px; border-radius:50%;"></span>${l.name}</span>
                    <span style="font-weight:bold;">${l.count}</span>
                </div>`;
            });
            tooltipEl.innerHTML = html;
        }
        const pos = context.chart.canvas.getBoundingClientRect();
        tooltipEl.style.opacity = 1;
        tooltipEl.style.left = pos.left + window.pageXOffset + tooltipModel.caretX + 'px';
        tooltipEl.style.top = pos.top + window.pageYOffset + tooltipModel.caretY + 'px';
    }

    function updateChart() {
        const datasets = [];
        players.forEach(p => {
            const cb = document.getElementById(`cb-${p.id}`);
            const data = playerData[p.id];
            if (cb && cb.checked && data && data.finishes.length > 0) {
                // Starts exactly when KR7 launches
                const points = [{ x: "2026-10-30T18:00:00Z", y: 0 }];
                data.finishes.forEach((f, index) => points.push({ x: f.isoDate, y: index + 1 }));
                points.push({ x: new Date().toISOString(), y: data.finishes.length });
                datasets.push({ label: p.name, data: points, borderColor: p.color, backgroundColor: p.color, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, stepped: true });
            }
        });
        chartInstance.data.datasets = datasets;
        chartInstance.update();
    }

    function showDetails(dateObj) {
        if(!dateObj || isNaN(dateObj)) return;
        selectedDay = dateObj.getDate();
        localStorage.setItem('kacky7_selected_day', selectedDay);
        
        const monthStr = dateObj.toLocaleString('en-us', { month: 'short' });
        document.getElementById('detailsHeader').innerText = `Finishes on ${monthStr} ${selectedDay}`;
        
        const list = document.getElementById('detailsList');
        list.innerHTML = '';
        let foundAny = false;

        players.forEach(p => {
            const cb = document.getElementById(`cb-${p.id}`);
            const data = playerData[p.id];
            if (cb && cb.checked && data) {
                let dailyFins = data.finishes.filter(f => f.dateObj.getDate() === selectedDay && f.dateObj.getMonth() === dateObj.getMonth());
                dailyFins.sort((a, b) => a.dateObj - b.dateObj);
                
                if (dailyFins.length > 0) {
                    foundAny = true;
                    const row = document.createElement('div');
                    row.style.marginBottom = '15px';
                    let html = `<div style="margin-bottom:5px"><strong style="color:${p.color}">${p.name}</strong> <span style="color:#666">(${dailyFins.length})</span></div><div style="display:flex; flex-wrap:wrap;">`;
                    dailyFins.forEach(f => {
                        const timeLabel = f.timeStr ? `<span class="ts">${f.timeStr}</span>` : '';
                        const action = f.clipUrl ? `window.open('${f.clipUrl}', '_blank')` : `openClip(${f.map})`;
                        html += `<div class="map-badge" onclick="${action}" title="Watch Clip">${timeLabel} <span>Map ${f.map}</span></div>`;
                    });
                    html += `</div>`;
                    row.innerHTML = html;
                    list.appendChild(row);
                }
            }
        });
        if (!foundAny) list.innerHTML = '<span class="empty-msg">No finishes found for selected players on this day.</span>';
    }

    async function openClip(mapId) {
        const url = `https://kacky.socr.am/api/twitch/clip/${mapId}`;
        const proxy = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
        try {
            const res = await fetch(proxy);
            const text = await res.text();
            const match = text.match(/https?:\/\/[^\s]+/);
            if(match) window.open(match[0], '_blank');
            else alert("No clip found.");
        } catch(e) { window.open(url, '_blank'); }
    }

    // UTILS
    function addCustomPlayer() { 
        const n = prompt("Name:"); 
        if(!n) return; 
        const k = prompt("ID:"); 
        const id = Date.now(); 
        players.push({ id, name:n, kid:k, color:`hsl(${Math.floor(Math.random()*360)},100%,70%)`}); 
        
        // Automatically check/show the new player
        let toggles = JSON.parse(localStorage.getItem('kacky7_view_toggles') || '[]');
        toggles.push(id);
        localStorage.setItem('kacky7_view_toggles', JSON.stringify(toggles));

        // Reset the 5-minute cooldown so we can fetch immediately
        lastFetchTime = 0;
        localStorage.setItem('kacky7_last_fetch', 0);
        
        sortPlayers(); 
        renderAll(); 
        saveState(); 

        // Automatically fetch data for the new player right away
        fetchLiveStats(true);
    }

    function deletePlayer(id) { if(!confirm("Delete?")) return; players = players.filter(p=>p.id!==id); delete playerData[id]; renderAll(); saveState(); }
    function saveState() { localStorage.setItem('kacky7_pro_config', JSON.stringify(players)); localStorage.setItem('kacky7_pro_data', JSON.stringify(playerData)); const t = players.filter(p=>document.getElementById(`cb-${p.id}`)?.checked).map(p=>p.id); localStorage.setItem('kacky7_view_toggles', JSON.stringify(t)); }
    function startTimer() { const el = document.getElementById('timer'); setInterval(() => { const diff = KACKY_END_DATE - new Date(); if(diff<=0) return el.innerText="FINISHED"; el.innerText = `${Math.floor(diff/86400000)}d ${Math.floor((diff%86400000)/3600000)}h ${Math.floor((diff%3600000)/60000)}m`; }, 1000); }
    const PRELOADED_STATE = null; 
    
    init();
</script>
</body>
</html>
